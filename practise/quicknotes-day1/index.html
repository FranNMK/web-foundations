<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
</head>
<body>
    <header>
        <h1>Quik Notes</h1>
        <p>Capture Ideas before they disappear.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form action="" id="note-form">
                <label for="note-input">New Note</label>
                <input type="text" name="" id="note-input" placeholder="Type a note......">
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Your Notes</h2>
            <p id="note-count">You have 2 notes.</p>
            <ul id="notes-list">
                <li>Revise HTML Forms</li>
                <li>Push my code to Github</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Quick Notes.Build during web foundations.</p>
    </footer>
    
</body>
</html>
